services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kutana
      POSTGRES_USER: kutana
      POSTGRES_PASSWORD: kutana_dev
    ports:
      - "5432:5432"
    volumes:
      - kutana-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutana -d kutana"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kutana-postgres:
